<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palkon Auto — The Solmar Story</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #142d38; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 5;
    font-family: Georgia, 'Times New Roman', serif; color: #ead8b2;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); pointer-events: none;
    user-select: none;
  }
  #hud .title { font-size: 22px; letter-spacing: 4px; font-weight: bold; }
  #hud .sub { font-size: 12px; letter-spacing: 2px; color: #d77f69; margin-top: 2px; }
  #hud .row { font-size: 14px; margin-top: 8px; }
  #hud .row b { color: #fff; }
  #minimap {
    position: fixed; right: 14px; top: 14px; z-index: 5;
    width: 220px; height: 198px; border: 2px solid rgba(234, 216, 178, 0.8);
    border-radius: 4px; background: #c9bd9a;
  }
  #hud-compass {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5;
    width: 220px; height: 26px; overflow: hidden; pointer-events: none;
    font-family: Georgia, serif; color: #ead8b2;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); user-select: none;
    border-bottom: 2px solid rgba(234, 216, 178, 0.5);
  }
  #compass-strip { position: absolute; top: 2px; left: 0; height: 22px; width: 2160px; }
  #compass-strip .tick {
    position: absolute; top: 0; font-size: 11px; color: rgba(234, 216, 178, 0.55);
    transform: translateX(-50%);
  }
  #compass-strip .tick.cardinal { font-size: 14px; font-weight: bold; color: #ead8b2; }
  #hud-compass::after {
    content: ''; position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-top: 6px solid #d77f69;
  }
  #hud-speed {
    position: fixed; right: 16px; bottom: 12px; z-index: 5;
    font-family: Georgia, serif; color: #ead8b2; text-align: right;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); pointer-events: none; user-select: none;
  }
  #hud-speed-num { font-size: 40px; font-weight: bold; line-height: 1; }
  #hud-speed .unit { font-size: 13px; letter-spacing: 2px; color: #d77f69; }
  #hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-family: Georgia, serif; font-size: 13px; color: rgba(234, 216, 178, 0.9);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); pointer-events: none; white-space: nowrap;
  }
  #status { position: fixed; right: 14px; top: 222px; z-index: 6; font: 10px monospace; color: #888; text-align: right; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="title">PALKON AUTO</div>
  <div class="sub">THE SOLMAR STORY</div>
  <div class="row"><span id="hud-district">Solmar</span> &middot; <span id="hud-preset">Midday</span> &middot; <b id="hud-fps"></b></div>
</div>
<canvas id="minimap" width="220" height="198"></canvas>
<div id="hud-compass"><div id="compass-strip"></div></div>
<div id="hud-speed"><span id="hud-speed-num">0</span> <span class="unit">km/h</span></div>
<div id="hint">Drag to look around &middot; Scroll to zoom &middot; 1 / 2 / 3 midday / sunset / night &middot; T cycle light</div>
<div id="status"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
